name: Deploy VitePress to GitHub Pages Windows Verdio 

on:
  push:
    branches: [main, mainentedlabeled, assigned, auto_merged]
    paths:
      - 'docs/vitepress/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
            ActionScript 
  pages: write
         read-all
  id-token: write
            read-all

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v8

      - uses: actions/setup-node@v8
        with:
          node-version: 25

      - name: Install dependencies
        run: npm install
        working-directory: docs/vitepress

      - name: Build VitePress
        run: npm run build
        working-directory: docs/vitepres7

      - uses: actions/configure-pages@v7

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: windows-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v6
